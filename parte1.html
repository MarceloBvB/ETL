<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación - Parte 1</title>
    <!-- Tailwind CSS (Interfaz Bonita) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl p-8 border border-gray-100">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Evaluación Parte 1: Limpieza de Datos</h1>
            <p class="text-gray-500 mt-2">Sube tu archivo y nosotros haremos el resto.</p>
        </div>

        <form id="etl-form" class="space-y-6">
            <!-- Arrastrar y Soltar / Subir Archivo -->
            <div class="w-full">
                <label for="file-upload" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 transition-all">
                    <div id="upload-prompt" class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Haz clic para subir</span> o arrastra tu archivo aquí</p>
                    </div>
                    <div id="file-info" class="hidden flex-col items-center justify-center text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                           <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                       </svg>
                       <p id="file-name" class="text-gray-700 font-medium mt-2 px-2 text-center"></p>
                   </div>
                    <input id="file-upload" type="file" class="hidden" accept=".csv,.txt,.zip" multiple required />
                </label>
            </div>

            <!-- Opciones extra -->
            <div class="bg-gray-50 p-4 rounded-lg border space-y-3">
                <div class="flex items-center space-x-3">
                    <input id="duplicados" type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                    <label for="duplicados" class="text-gray-700 font-medium">Eliminar registros duplicados</label>
                </div>
            </div>

            <!-- Separador -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <h3 class="font-semibold text-gray-700">Separador del archivo</h3>
                <select id="separador" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value=",">Coma (,)</option>
                    <option value=";">Punto y coma (;)</option>
                    <option value="\t">Tabulador</option>
                </select>
            </div>

            <!-- Nombre de Descarga -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <h3 class="font-semibold text-gray-700">Nombre del archivo final (Opcional)</h3>
                <div>
                    <input id="nombre_descarga" type="text" placeholder="Ej: mis_datos_limpios" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                </div>
            </div>

            <button id="submit-button" type="submit" class="w-full flex justify-center items-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-bold rounded-xl text-lg px-5 py-3.5 text-center transition-all shadow-md disabled:bg-blue-400 disabled:cursor-not-allowed">
                <span id="button-text">Limpiar y Descargar Datos</span>
                <svg id="spinner" class="animate-spin ml-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <button id="download-log-button" type="button" class="hidden w-full flex justify-center items-center text-blue-700 bg-blue-100 hover:bg-blue-200 focus:ring-4 focus:ring-blue-300 font-bold rounded-xl text-md px-5 py-2.5 text-center transition-all disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed">
                Descargar Registro de Cambios (TXT)
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('etl-form');
        const fileInput = document.getElementById('file-upload');
        const uploadPrompt = document.getElementById('upload-prompt');
        const fileInfo = document.getElementById('file-info');
        const fileNameDisplay = document.getElementById('file-name');
        const submitButton = document.getElementById('submit-button');
        const buttonText = document.getElementById('button-text');
        const spinner = document.getElementById('spinner');
        const separadorInput = document.getElementById('separador');
        const downloadLogButton = document.getElementById('download-log-button');
        
        let lastLogData = null;

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                if (fileInput.files.length === 1) {
                    fileNameDisplay.textContent = fileInput.files[0].name;
                } else {
                    fileNameDisplay.textContent = `${fileInput.files.length} archivos seleccionados`;
                }
                uploadPrompt.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                fileInfo.classList.add('flex');
                downloadLogButton.classList.add('hidden');
                lastLogData = null;
            }
        });

        downloadLogButton.addEventListener('click', async () => {
            if (!lastLogData) {
                alert("No hay ningún registro de cambios para descargar. Primero procesa un archivo.");
                return;
            }

            downloadLogButton.disabled = true;
            downloadLogButton.textContent = 'Generando archivo TXT...';

            try {
                const response = await fetch('/api/descargar_log_txt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ log_lines: lastLogData })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al generar el TXT: ${errorText}`);
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'log_de_cambios.txt';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert(`Ocurrió un error al descargar el log: ${error.message}`);
            } finally {
                downloadLogButton.disabled = false;
                downloadLogButton.textContent = 'Descargar Registro de Cambios (TXT)';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (fileInput.files.length === 0) {
                alert('Por favor, selecciona al menos un archivo para procesar.');
                return;
            }

            downloadLogButton.classList.add('hidden');
            lastLogData = null;

            const duplicados = document.getElementById('duplicados').checked;
            const separador = separadorInput.value;
            const nombreDescargaInput = document.getElementById('nombre_descarga').value.trim();
            
            submitButton.disabled = true;
            buttonText.textContent = 'Iniciando proceso...';
            spinner.classList.remove('hidden');

            try {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    buttonText.textContent = `Paso 1/3: Limpiando archivo ${i + 1}...`;
                    
                    let customName = nombreDescargaInput;
                    if (customName && fileInput.files.length > 1) {
                        customName = `${customName}_${i + 1}`;
                    }

                    const safeFileName = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_.-]/g, "_");

                    const formData = new FormData();
                    formData.append('file', file, safeFileName);
                    formData.append('eliminar_duplicados', duplicados);
                    formData.append('separador', separador);
                    formData.append('columnas_eliminar', '[]');
                    formData.append('mapa_nombres', '{}');
                    formData.append('formato_descarga', 'excel'); // Forzar siempre Excel
                    formData.append('nombre_descarga', customName);
                    formData.append('nombre_tabla', ''); // Vacío para no guardar en DB
                    
                    const response = await fetch('/api/procesar', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Error en el archivo ${file.name}: ${response.statusText}. Detalles: ${errorText}`);
                    }

                    const logHeader = response.headers.get('X-ETL-Log');
                    if (logHeader) {
                        lastLogData = JSON.parse(logHeader);
                        downloadLogButton.classList.remove('hidden');
                        downloadLogButton.disabled = false;
                    }

                    const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    let extension = 'xlsx'; // Formato de descarga siempre será excel en frontend
                    
                    buttonText.textContent = `Paso 2/3: Descargando archivo limpio...`;

                    const blob = await response.blob();
                    buttonText.textContent = `Paso 3/3: Guardando en tu PC...`;
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = customName ? `${customName}.${extension}` : `limpio_${baseName}.${extension}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                }

                alert('¡Proceso completado con éxito!');

            } catch (error) {
                console.error('Error en el proceso:', error);
                alert(`Ocurrió un error al procesar el archivo: ${error.message}`);
                if (error.message.includes("Failed to fetch")) {
                    alert("❌ Error de conexión por tiempo de espera.\n\nTu archivo se está limpiando correctamente, pero tu conexión a internet está tardando demasiado en enviarlo completo a la base de datos Neon.");
                }
            } finally {
                submitButton.disabled = false;
                buttonText.textContent = 'Limpiar y Descargar Datos';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
