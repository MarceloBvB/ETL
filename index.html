<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación ETL PRO</title>
    <!-- Tailwind CSS (Interfaz Bonita) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl p-8 border border-gray-100">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Limpieza de Datos</h1>
            <p class="text-gray-500 mt-2">Sube tu archivo y nosotros haremos el resto.</p>
        </div>

        <form id="etl-form" class="space-y-6">
            <!-- Arrastrar y Soltar / Subir Archivo -->
            <div class="w-full">
                <label for="file-upload" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 transition-all">
                    <div id="upload-prompt" class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Haz clic para subir</span> o arrastra tu archivo aquí</p>
                    </div>
                    <div id="file-info" class="hidden flex-col items-center justify-center text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                           <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                       </svg>
                       <p id="file-name" class="text-gray-700 font-medium mt-2 px-2 text-center"></p>
                   </div>
                    <input id="file-upload" type="file" class="hidden" accept=".csv,.txt,.zip" multiple required />
                </label>
            </div>

            <!-- Opciones extra -->
            <div class="bg-gray-50 p-4 rounded-lg border space-y-3">
                <div class="flex items-center space-x-3">
                    <input id="duplicados" type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                    <label for="duplicados" class="text-gray-700 font-medium">Eliminar registros duplicados</label>
                </div>
                <div class="flex items-center space-x-3">
                    <input id="incluir_log" type="checkbox" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500" checked>
                    <label for="incluir_log" class="text-gray-700 font-medium">Descargar ZIP con archivo de registro (Log de cambios)</label>
                </div>
            </div>

            <!-- Gestión de Columnas (Interactivo) -->
            <div id="column-management-section" class="hidden bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-gray-700">Gestión de Columnas</h3>
                </div>
                <p class="text-xs text-gray-500">Desmarca las columnas que no quieres incluir. Haz clic en el lápiz para renombrar.</p>
                <div id="column-list" class="max-h-52 overflow-y-auto bg-white border border-gray-200 rounded-md divide-y divide-gray-100">
                    <!-- Se llena automáticamente con Javascript -->
                </div>
            </div>

            <!-- Separador -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <h3 class="font-semibold text-gray-700">Separador del archivo</h3>
                <select id="separador" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value=",">Coma (,)</option>
                    <option value=";">Punto y coma (;)</option>
                    <option value="\t">Tabulador</option>
                </select>
            </div>

            <!-- Vista Previa -->
            <div id="preview-section" class="hidden bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3 overflow-x-auto">
                <h3 class="font-semibold text-gray-700 text-sm">Vista previa (Primeras filas)</h3>
                <div id="preview-table-container" class="text-sm text-gray-600"></div>
            </div>

            <!-- Formato de Descarga -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <h3 class="font-semibold text-gray-700">Formato de descarga</h3>
                <select id="formato_descarga" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value="csv">CSV (Recomendado, universal)</option>
                    <option value="excel">Excel (.xlsx)</option>
                    <option value="parquet">Parquet (Rápido, ideal para Big Data)</option>
                </select>
            </div>

            <!-- Nombre de Descarga -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <h3 class="font-semibold text-gray-700">Nombre del archivo final (Opcional)</h3>
                <div>
                    <input id="nombre_descarga" type="text" placeholder="Ej: mis_datos_limpios" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                </div>
            </div>

            <button id="submit-button" type="submit" class="w-full flex justify-center items-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-bold rounded-xl text-lg px-5 py-3.5 text-center transition-all shadow-md disabled:bg-blue-400 disabled:cursor-not-allowed">
                <span id="button-text">Limpiar y Descargar Datos</span>
                <svg id="spinner" class="animate-spin ml-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('etl-form');
        const fileInput = document.getElementById('file-upload');
        const uploadPrompt = document.getElementById('upload-prompt');
        const fileInfo = document.getElementById('file-info');
        const fileNameDisplay = document.getElementById('file-name');
        const submitButton = document.getElementById('submit-button');
        const buttonText = document.getElementById('button-text');
        const spinner = document.getElementById('spinner');
        const separadorInput = document.getElementById('separador');
        const previewSection = document.getElementById('preview-section');
        const previewTableContainer = document.getElementById('preview-table-container');
        const columnManagementSection = document.getElementById('column-management-section');
        const columnList = document.getElementById('column-list');
        
        let columnState = []; // Almacena el estado de las columnas (conservar, original, nuevo nombre)

        function updatePreview() {
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            const separador = separadorInput.value;
            
            // Leer solo un pedacito (50KB) para la vista previa súper rápida
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '').slice(0, 6); // 1 header + 5 filas
                
                if (lines.length === 0) return;
                
                let html = '<table class="min-w-full divide-y divide-gray-200 text-left text-xs"><thead class="bg-gray-200"><tr>';
                const headers = lines[0].split(separador);
                headers.forEach(h => html += `<th class="px-3 py-2 font-semibold text-gray-700 border">${h.trim()}</th>`);
                html += '</tr></thead><tbody class="bg-white divide-y divide-gray-200">';
                
                for (let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(separador);
                    html += '<tr>';
                    for (let j = 0; j < headers.length; j++) {
                        const cellValue = cells[j] !== undefined ? cells[j].trim() : '';
                        html += `<td class="px-3 py-2 border whitespace-nowrap">${cellValue}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</tbody></table>';
                
                previewTableContainer.innerHTML = html;
                previewSection.classList.remove('hidden');
                
                // Inicializar la gestión de columnas
                columnState = headers.map(h => ({ original: h.trim(), name: h.trim(), keep: true }));
                renderColumns();
                columnManagementSection.classList.remove('hidden');
            };
            reader.readAsText(file.slice(0, 50000));
        }
        
        function renderColumns() {
            columnList.innerHTML = '';
            columnState.forEach((col, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-2 hover:bg-gray-50 transition-colors';
                div.innerHTML = `
                    <div class="flex items-center space-x-3 w-full overflow-hidden">
                        <input type="checkbox" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 flex-shrink-0" ${col.keep ? 'checked' : ''} onchange="toggleColumn(${index}, this.checked)">
                        <div class="flex-1 flex items-center min-w-0">
                            <span id="span-${index}" class="text-sm font-medium text-gray-700 truncate w-full" title="${col.original}">${col.name}</span>
                            <input id="input-${index}" type="text" class="hidden w-full text-sm border border-blue-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500" value="${col.name}" onkeydown="if(event.key==='Enter'){saveEdit(${index}); event.preventDefault();}">
                        </div>
                    </div>
                    <div class="flex-shrink-0 ml-2 flex space-x-1">
                        <button type="button" id="btn-${index}" class="p-1.5 text-gray-400 hover:text-blue-600 rounded hover:bg-blue-50 transition-all" onclick="toggleEdit(${index})" title="Renombrar columna">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                        <button type="button" id="save-${index}" class="hidden p-1.5 text-green-600 hover:text-green-700 rounded hover:bg-green-50 transition-all" onclick="saveEdit(${index})" title="Guardar">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                `;
                columnList.appendChild(div);
            });
        }
        
        window.toggleColumn = function(index, checked) {
            columnState[index].keep = checked;
        };

        window.toggleEdit = function(index) {
            document.getElementById(`span-${index}`).classList.add('hidden');
            document.getElementById(`btn-${index}`).classList.add('hidden');
            const input = document.getElementById(`input-${index}`);
            input.classList.remove('hidden');
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            document.getElementById(`save-${index}`).classList.remove('hidden');
        };

        window.saveEdit = function(index) {
            const newVal = document.getElementById(`input-${index}`).value.trim();
            if (newVal) columnState[index].name = newVal;
            renderColumns(); // Re-renderizar la lista
        };

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                if (fileInput.files.length === 1) {
                    fileNameDisplay.textContent = fileInput.files[0].name;
                } else {
                    fileNameDisplay.textContent = `${fileInput.files.length} archivos seleccionados`;
                }
                uploadPrompt.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                fileInfo.classList.add('flex');
                updatePreview();
            }
        });

        separadorInput.addEventListener('change', updatePreview);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (fileInput.files.length === 0) {
                alert('Por favor, selecciona al menos un archivo para procesar.');
                return;
            }

            const duplicados = document.getElementById('duplicados').checked;
            const incluirLog = document.getElementById('incluir_log').checked;
            const separador = separadorInput.value;
            const formatoDescarga = document.getElementById('formato_descarga').value;
            const nombreDescargaInput = document.getElementById('nombre_descarga').value.trim();
            
            // Extraer del estado visual: Columnas a quitar y nombres nuevos
            const colsAEliminar = columnState.filter(c => !c.keep).map(c => c.original);
            const mapaNombres = {};
            columnState.filter(c => c.keep && c.original !== c.name).forEach(c => {
                mapaNombres[c.original] = c.name;
            });
            
            // Deshabilitar botón y mostrar feedback de carga
            submitButton.disabled = true;
            buttonText.textContent = 'Iniciando proceso...';
            spinner.classList.remove('hidden');

            try {
                // Procesar cada archivo secuencialmente
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    buttonText.textContent = `Paso 1/3: Limpiando archivo ${i + 1}...`;
                    
                    // Generar nombre de tabla seguro desde el nombre del archivo (ej: "Ventas Enero.csv" -> "ventas_enero")
                    const nombreTabla = file.name.split('.')[0].replace(/[^a-zA-Z0-9_]/g, '_').toLowerCase();

                    let customName = nombreDescargaInput;
                    if (customName && fileInput.files.length > 1) {
                        customName = `${customName}_${i + 1}`;
                    }

                    // Limpiar el nombre del archivo para evitar errores del servidor por tildes o caracteres especiales (ej: Matrícula -> Matricula)
                    const safeFileName = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_.-]/g, "_");

                    const formData = new FormData();
                    formData.append('file', file, safeFileName);
                    formData.append('eliminar_duplicados', duplicados);
                    formData.append('incluir_log', incluirLog);
                    formData.append('separador', separador);
                    formData.append('columnas_eliminar', JSON.stringify(colsAEliminar));
                    formData.append('mapa_nombres', JSON.stringify(mapaNombres));
                    formData.append('formato_descarga', formatoDescarga);
                    formData.append('nombre_descarga', customName);
                    // Siempre enviamos el nombre de la tabla para que el backend la guarde
                    formData.append('nombre_tabla', nombreTabla);
                    
                    // Llamada a la API de FastAPI
                    const response = await fetch('/api/procesar', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Error en el archivo ${file.name}: ${response.statusText}. Detalles: ${errorText}`);
                    }

                    const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    let extension = formatoDescarga === 'excel' ? 'xlsx' : formatoDescarga === 'parquet' ? 'parquet' : 'csv';
                    
                    if (incluirLog) {
                        extension = 'zip';
                    }

                    buttonText.textContent = `Paso 2/3: Descargando archivo limpio...`;

                    const blob = await response.blob();
                    buttonText.textContent = `Paso 3/3: Guardando en tu PC...`;
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = customName ? `${customName}.${extension}` : `limpio_${baseName}.${extension}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                }

                alert('¡Proceso completado con éxito!');

            } catch (error) {
                console.error('Error en el proceso:', error);
                alert(`Ocurrió un error al procesar el archivo: ${error.message}`);
                if (error.message.includes("Failed to fetch")) {
                    alert("❌ Error de conexión por tiempo de espera.\n\nTu archivo se está limpiando correctamente, pero tu conexión a internet está tardando demasiado en enviarlo completo a la base de datos Neon. Cuando subas tu API a un servidor en la nube de AWS, este error desaparecerá gracias a la gran velocidad de red del servidor.");
                } else {
                    alert(`Ocurrió un error al procesar el archivo: ${error.message}`);
                }
            } finally {
                // Rehabilitar botón y ocultar spinner en cualquier caso (éxito o error)
                submitButton.disabled = false;
                buttonText.textContent = 'Limpiar y Descargar Datos';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
